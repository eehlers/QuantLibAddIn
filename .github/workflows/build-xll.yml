name: Build QuantLibXL XLL

# Manually-triggered build of the QuantLibXL Excel add-in (.xll) as a
# static-CRT Release for both x64 and Win32 (x86).  Runs on the GitHub-hosted
# windows-latest runner (Visual Studio 2026, toolset v145) and uploads each
# XLL as a build artifact.
#
# QuantLib is not committed to this repository (it is .gitignore'd), so it is
# cloned at build time from the same owner as this repository:
#   OpenSourceRisk/QuantLibAddIn  -> clones OpenSourceRisk/QuantLib
#   eehlers/QuantLibAddIn         -> clones eehlers/QuantLib
# The add-in build always expects the sources in a camel-case "QuantLib"
# folder at the repository root.

on:
  workflow_dispatch:
    inputs:
      quantlib_ref:
        description: "QuantLib git ref (branch, tag or SHA) to build against"
        required: true
        default: "master"
      boost_version:
        description: "Boost version to build (dotted, e.g. 1.89.0). Must be new enough for the VS 2026 / v145 toolset."
        required: true
        default: "1.89.0"
      arch:
        description: "Which architecture(s) to build"
        required: true
        type: choice
        default: both
        options:
          - both
          - x64
          - Win32

permissions:
  contents: read

jobs:
  setup:
    # Build the matrix from the `arch` input so we can run only x64, only
    # Win32, or both.  (A job-level `if` cannot reference `matrix`, so the leg
    # selection must happen here.)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set
        shell: bash
        run: |
          x64='{"arch":"x64","address_model":"64","vcvars_arch":"amd64","boost_stage":"stage","xll_name":"QuantLibXL-v145-x64-mt-s-1_42_0.xll"}'
          win32='{"arch":"Win32","address_model":"32","vcvars_arch":"x86","boost_stage":"stage32","xll_name":"QuantLibXL-v145-mt-s-1_42_0.xll"}'
          case "${{ inputs.arch }}" in
            x64)   include="[$x64]" ;;
            Win32) include="[$win32]" ;;
            *)     include="[$x64,$win32]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build-xll:
    needs: setup
    # windows-latest maps to the windows-2025-vs2026 image (Visual Studio 2026
    # / v145).  The Boost version below must be recent enough for its
    # bootstrap.bat/b2 to recognise the v145 toolset.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      BOOST_ROOT_DIR: ${{ github.workspace }}\boost
      BUILD_DIR: ${{ github.workspace }}\build\ci-vs2026-${{ matrix.arch }}-static

    steps:
      - name: Checkout QuantLibAddin
        uses: actions/checkout@v4

      - name: Clone QuantLib (same owner as this repo)
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          $url   = "https://github.com/$owner/QuantLib.git"
          Write-Host "Cloning $url @ ${{ github.event.inputs.quantlib_ref }} into QuantLib/"
          git clone --depth 1 --branch "${{ github.event.inputs.quantlib_ref }}" $url QuantLib
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Branch/tag clone failed; falling back to default branch + checkout"
              git clone $url QuantLib
              if ($LASTEXITCODE -ne 0) { throw "git clone of $url failed" }
              git -C QuantLib checkout "${{ github.event.inputs.quantlib_ref }}"
              if ($LASTEXITCODE -ne 0) { throw "git checkout of ${{ github.event.inputs.quantlib_ref }} failed" }
          }
          if (-not (Test-Path "QuantLib/ql/version.hpp")) {
              throw "QuantLib sources not found after clone (QuantLib/ql/version.hpp missing)"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute Boost identifiers
        id: boost
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.boost_version }}"
          $u = $v -replace '\.', '_'
          "version=$v"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "underscore=$u"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "libdir=$env:BOOST_ROOT_DIR\${{ matrix.boost_stage }}\lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache Boost (${{ matrix.arch }})
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT_DIR }}
          key: boost-${{ steps.boost.outputs.version }}-${{ matrix.arch }}-vc145-static-v1

      - name: Build Boost (${{ matrix.arch }})
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set BOOST_V=${{ steps.boost.outputs.version }}
          set BOOST_U=${{ steps.boost.outputs.underscore }}
          set BOOST_DIR=%BOOST_ROOT_DIR%
          echo Downloading Boost %BOOST_V%
          curl -L -o boost.7z https://archives.boost.io/release/%BOOST_V%/source/boost_%BOOST_U%.7z || exit /b 1
          7z x boost.7z -o"%GITHUB_WORKSPACE%" >nul || exit /b 1
          move "%GITHUB_WORKSPACE%\boost_%BOOST_U%" "%BOOST_DIR%" || exit /b 1
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"!VSWHERE!" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL ( echo Could not locate Visual Studio via vswhere & exit /b 1 )
          echo Using Visual Studio at "!VSINSTALL!"
          call "!VSINSTALL!\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars_arch }} || exit /b 1
          cd /d "%BOOST_DIR%"
          rem Boost's bootstrap engine builder only auto-detects up to vc143 and
          rem reports "Unknown toolset: vcunk" for the VS 2026 (v145) compiler.
          rem Passing "msvc" forces it to use cl.exe from the vcvarsall
          rem environment directly to build the b2 engine.
          call bootstrap.bat msvc || exit /b 1
          rem b2's own msvc auto-detection fails to recognise v145 and silently
          rem falls back to a bogus "msvc-6.0" toolset. Pointing it directly at
          rem cl.exe gets the right compiler, but version "14.5" is not in b2
          rem 1.89's known-version list, so it cannot generate the compiler
          rem "setup" target and skips every object ("for lack of msvc-setup").
          rem Register the compiler under the known version 14.3 (whose config
          rem logic is compatible) while pointing it at the real v145 cl.exe.
          for /f "delims=" %%i in ('where cl 2^>nul') do if not defined CL_EXE set "CL_EXE=%%i"
          if not defined CL_EXE ( echo Could not locate cl.exe on PATH & exit /b 1 )
          set "CL_JAM=!CL_EXE:\=/!"
          echo Using cl.exe at "!CL_EXE!"
          > user-config.jam echo using msvc : 14.3 : "!CL_JAM!" ;
          .\b2 -j%NUMBER_OF_PROCESSORS% ^
              --user-config="%BOOST_DIR%\user-config.jam" ^
              toolset=msvc-14.3 ^
              address-model=${{ matrix.address_model }} ^
              architecture=x86 ^
              link=static runtime-link=static threading=multi variant=release ^
              --stagedir=${{ matrix.boost_stage }} ^
              --with-filesystem --with-serialization --with-system ^
              --with-thread --with-date_time --with-chrono --with-atomic ^
              stage || exit /b 1

      - name: Configure (CMake, VS 2026 ${{ matrix.arch }}, static Release)
        shell: cmd
        run: |
          cmake -S "%GITHUB_WORKSPACE%" -B "%BUILD_DIR%" ^
              -G "Visual Studio 18 2026" -A ${{ matrix.arch }} ^
              -DRUN_GENSRC=ON ^
              -DMSVC_LINK_DYNAMIC_RUNTIME=OFF ^
              -DBoost_USE_STATIC_RUNTIME=ON ^
              -DQL_BUILD_EXAMPLES=OFF ^
              -DQL_BUILD_TEST_SUITE=OFF ^
              -DQL_ENABLE_SESSIONS=ON ^
              -DBOOST_INCLUDEDIR="%BOOST_ROOT_DIR%" ^
              -DBOOST_LIBRARYDIR="${{ steps.boost.outputs.libdir }}" || exit /b 1

      - name: Build QuantLibXL (Release)
        shell: cmd
        run: |
          cmake --build "%BUILD_DIR%" --config Release --target QuantLibXL || exit /b 1

      - name: Verify XLL output
        shell: pwsh
        run: |
          $xll = Join-Path $env:BUILD_DIR "xll\${{ matrix.xll_name }}"
          if (-not (Test-Path $xll)) {
              Write-Host "Expected XLL not found: $xll"
              Get-ChildItem -Recurse (Join-Path $env:BUILD_DIR "xll") -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length
              throw "XLL not produced"
          }
          $item = Get-Item $xll
          Write-Host "Produced $($item.FullName) ($([math]::Round($item.Length/1MB,2)) MB)"

      - name: Upload XLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantLibXL-${{ matrix.arch }}
          path: ${{ env.BUILD_DIR }}\xll\${{ matrix.xll_name }}
          if-no-files-found: error
